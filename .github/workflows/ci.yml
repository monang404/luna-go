name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./go

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build
      run: go build ./...

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ./...

    - name: Test with Race Detector
      if: runner.os != 'Windows'
      run: go test -race ./internal/tools/... ./internal/llmclient/... ./internal/subagent/... ./internal/permission/...

    - name: Smoke test binary
      run: |
        go build -o ../luna-smoke${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/luna
        ../luna-smoke${{ runner.os == 'Windows' && '.exe' || '' }} --help
