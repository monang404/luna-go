session:
  id: SESSION-01
  title: Fix RC-001 — local path collision breaks 7 core tool functions
  category: security
  priority: P0
  complexity: S
  weight: 2
objective: >-
  Eliminate the `local path` / zsh tied-special-parameter ($PATH) collision in all 7 core filesystem/git
  tool functions by renaming the local variable, and remove the silent '.' fallback in list_dir so path-extraction
  failure is distinguishable from a legitimately-omitted path.
backlog_items:
- id: SEC-001
  role: primary
- id: BUG-001
  role: primary
root_causes:
- RC-001
depends_on: []
blocks:
- SESSION-03
- SESSION-37
boundary_rationale: >-
  SEC-001 and BUG-001 share RC-001 (local path shadows zsh's tied $path/$PATH special parameter), the
  exact same failure mechanism, fully overlapping affected files (05-tools/10-tool_fs_read.zsh, 20-tool_fs_write.zsh,
  25-tool_fs_patch_delete.zsh, 40-tool_git.zsh), and an identical mechanical remediation (rename local
  path -> local fs_path). They can be verified with one shared test pass and form one coherent, safe change.
why_not_more:
- Other RC-001-adjacent items (e.g. ARCH-002's startup self-check) are a distinct concern — preventing
  *future* silent breakage from any missing function, not this specific collision — and are scheduled
  separately (Session 07) so this session stays a pure mechanical fix with minimal blast radius.
why_not_less:
- BUG-001 (list_dir) is caused by the exact same collision as SEC-001 and requires the identical rename;
  splitting them would duplicate the file-open/verification work for no safety benefit and violates the
  'smallest safe coherent change' principle.
scope:
  include:
  - Rename `local path` -> `local fs_path` in all 7 functions
  - Update all `$path` references within each function body to `$fs_path`
  - Add explicit error path in `_ai_tool_list_dir` distinguishing 'extraction genuinely failed' from 'model
    omitted path (default to .)'
  - 'Add CI lint rule: `grep -rn ''local path\b'' 30-ai/` hard-fails'
  exclude:
  - Any other variable renames (status, pipestatus, reply, options are out of scope)
  - Behavioral changes to any of the 7 tools beyond removing the collision
affected_files:
- 05-tools/10-tool_fs_read.zsh
- 05-tools/20-tool_fs_write.zsh
- 05-tools/25-tool_fs_patch_delete.zsh
- 05-tools/40-tool_git.zsh
affected_functions:
- _ai_tool_read_file
- _ai_tool_write_file
- _ai_tool_edit_file
- _ai_tool_patch_file
- _ai_tool_delete_file
- _ai_tool_count_lines
- _ai_tool_git_diff
- _ai_tool_list_dir
subtasks:
- id: '01'
  title: Inspect all affected files/functions for local path collision breaks 7 core tool functions
  type: analysis
  required: true
- id: '02'
  title: Implement the recommended fix(es) for this session's backlog items
  type: implementation
  required: true
- id: '03'
  title: Integrate the change with existing callers and verify no other call sites were missed
  type: integration
  required: true
- id: '04'
  title: Verify each acceptance criterion for this session's backlog items
  type: verification
  required: true
- id: '05'
  title: Run regression checks
  type: regression
  required: true
- id: '06'
  title: Update CHANGELOG.md
  type: documentation
  required: true
- id: '07'
  title: Create full repository checkpoint
  type: checkpoint
  required: true
acceptance_criteria:
- id: AC-01
  description: All 7 tools succeed with a valid path/args.path argument (no 'membutuhkan args.path' error)
  verification: UNIT
- id: AC-02
  description: $PATH remains non-empty for the full duration of each function's execution
  verification: UNIT
- id: AC-03
  description: _ai_tool_extract_path/_field return correct values when called from within these functions
  verification: UNIT
- id: AC-04
  description: list_dir with explicit non-'.' path lists that path, not '.'
  verification: UNIT
- id: AC-05
  description: list_dir with no path argument still defaults to '.' (behavior preserved)
  verification: UNIT
- id: AC-06
  description: list_dir surfaces an explicit error when extraction genuinely fails (malformed JSON)
  verification: UNIT
- id: AC-07
  description: No variable other than path/fs_path is touched (regression-lint scope confirmed)
  verification: STATIC
tests:
  targeted:
  - Call each of the 7 tools with minimal valid args, assert no generic error message
  - zsh -c 'f(){ local fs_path; command -v ls; }; f' sanity check for the pattern itself
  - list_dir with explicit path vs. omitted path vs. malformed JSON — 3 distinct behaviors
regression_checks:
- 'CI lint: grep -rn ''local path\b'' 30-ai/ must return zero matches'
- Full grep confirms 8 functions across 4 files updated consistently
risk:
  level: low
  blast_radius: high
  rollback: easy
completion_state:
  application_usable: true
  syntax_valid: true
  tests_passed: true
  changelog_updated: true
  checkpoint_created: true
checkpoint:
  required: true
  filename: agent-after-SESSION-01.zip
  contains: entire repository
notes: >-
  Highest-leverage single fix in the whole backlog per the audit's own priority ranking; purely mechanical,
  no behavior change intended beyond removing the collision.
handoff:
  next_session: SESSION-02
  notes: >-
    This session's changes must leave the application fully usable. Sessions SESSION-03, SESSION-37 depend
    on this session's checkpoint as their safe baseline.
