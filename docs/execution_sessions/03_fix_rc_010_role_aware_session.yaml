  - Python/zsh simulation replaying the exact _ai_session_ask append pattern for 50 turns
  - Agent-loop append pattern replayed for 50 steps, confirm unchanged
regression_checks:
- Automated test asserting role alternation holds at every trim boundary for both consumers
risk:
