  title: Integrate the change with existing callers and verify no other call sites were missed
  type: integration
  required: true
- id: '04'
  title: Verify each acceptance criterion for this session's backlog items
  type: verification
  required: true
- id: '05'
  title: Run regression checks
  type: regression
  required: true
- id: '06'
  title: Update CHANGELOG.md
  type: documentation
  required: true
- id: '07'
  title: Create full repository checkpoint
  type: checkpoint
  required: true
acceptance_criteria:
- id: AC-01
  description: After 20+ simulated ail turns, the first message after system is always 'user'
  verification: UNIT
- id: AC-02
  description: Agent-loop trim behavior (currently correct/odd-parity) shows no regression
  verification: REGRESSION
- id: AC-03
  description: Round-trip test (append->trim, repeated 30+ times) never produces two consecutive same-role
    messages
  verification: UNIT
tests:
