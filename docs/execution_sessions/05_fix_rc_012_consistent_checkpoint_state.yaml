session:
  id: SESSION-05
  title: Fix RC-012 — consistent checkpoint/state-transition failure handling policy
  category: reliability
  priority: P1
  complexity: M
  weight: 3
objective: >-
  Audit every `_ai_agent_checkpoint_save` and `_ai_agent_state_transition` call site, decide and document
  a single explicit policy for which failures may silently continue vs. must be surfaced/fatal, and apply
  that policy consistently across all call sites (BUG-006, BUG-007, REL-001, REL-002).
backlog_items:
- id: BUG-006
  role: primary
- id: BUG-007
  role: primary
- id: REL-001
  role: primary
- id: REL-002
  role: primary
root_causes:
- RC-012
depends_on: []
blocks: []
boundary_rationale: >-
  All four items share RC-012 — inconsistent checking of checkpoint/state-transition return codes across
  the same subsystem (50-agent/42-execution/* and 06-permissions/15-permission_check.zsh). The remediation
  is identical in kind for all four: decide a policy, then apply it uniformly. This is exactly the pattern
  the planning instructions call out as a case where one session should cover multiple bugs.
why_not_more:
- No other backlog item shares RC-012; ARCH-002 (startup self-check) is a different failure class (missing
  function definitions, not checkpoint/state save failures) and is scheduled separately (Session 07).
why_not_less:
- BUG-006 and BUG-007 are the identical pattern at different call-site frequencies; REL-001/REL-002 are
  the same silent-failure-handling root cause in adjacent files. Splitting into 4 sessions would mean
  deciding the same policy 4 times and re-verifying the same regression 4 times.
scope:
  include:
  - 'Audit all _ai_agent_checkpoint_save call sites (hottest: exec_track_and_continue; reject_checks x2)'
  - Audit all _ai_agent_state_transition call sites (05-get_plan.zsh fatal vs. 00-loop_main.zsh silent)
  - Audit run_test's _ai_validate_project_path || true in 15-permission_check.zsh
  - Document the decided policy; apply consistently; surface warnings where policy says 'must be visible'
  exclude:
  - Any change to checkpoint file format or state machine semantics beyond error handling
affected_files:
- 50-agent/42-execution/25-track_and_continue.zsh
- 50-agent/42-execution/10-reject_checks.zsh
- 50-agent/42-execution/05-get_plan.zsh
- 50-agent/42-execution/00-loop_main.zsh
- 06-permissions/15-permission_check.zsh
affected_functions:
- _ai_agent_checkpoint_save
- _ai_agent_state_transition
- _ai_agent_exec_track_and_continue
- _ai_agent_exec_check_done_rejections
subtasks:
- id: '01'
  title: Inspect all affected files/functions for consistent checkpoint/state-transition failure handling
    policy
  type: analysis
  required: true
- id: '02'
  title: Implement the recommended fix(es) for this session's backlog items
  type: implementation
  required: true
- id: '03'
  title: Integrate the change with existing callers and verify no other call sites were missed
  type: integration
  required: true
- id: '04'
  title: Verify each acceptance criterion for this session's backlog items
  type: verification
  required: true
- id: '05'
  title: Run regression checks
  type: regression
  required: true
- id: '06'
  title: Update CHANGELOG.md
  type: documentation
  required: true
- id: '07'
  title: Create full repository checkpoint
  type: checkpoint
  required: true
acceptance_criteria:
- id: AC-01
  description: A documented failure-handling policy exists covering checkpoint_save and state_transition
  verification: STATIC
- id: AC-02
  description: checkpoint_save failure at the hottest call path produces a visible warning
  verification: UNIT
- id: AC-03
  description: checkpoint_save failure at the 2 reject_checks sites produces the same visible warning
  verification: UNIT
- id: AC-04
  description: run_test path-validation behavior is explicit and matches documented intent
  verification: STATIC
- id: AC-05
  description: All state_transition call sites conform to the single documented policy
  verification: STATIC
tests:
  targeted:
  - Simulate checkpoint_save failure (disk full / permission denied) at each call site, assert warning
    appears
  - Simulate state_transition failure at get_plan.zsh and loop_main.zsh, assert consistent behavior
regression_checks:
- Grep-based check confirming no remaining unguarded checkpoint_save/state_transition call sites
risk:
  level: medium
  blast_radius: medium
  rollback: easy
completion_state:
  application_usable: true
  syntax_valid: true
  tests_passed: true
  changelog_updated: true
  checkpoint_created: true
checkpoint:
  required: true
  filename: agent-after-SESSION-05.zip
  contains: entire repository
handoff:
  next_session: SESSION-06
  notes: >-
    This session's changes must leave the application fully usable. No downstream session strictly depends
    on this one; safe to run in any order relative to independent sessions.
