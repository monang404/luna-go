session:
  id: SESSION-06
  title: Fix RC-013 — restore backup instead of deleting it on failed mv overwrite
  category: reliability
  priority: P1
  complexity: S
  weight: 2
objective: >-
  Stop deleting the backup file on a failed mv overwrite in aicode's and aipatch's apply paths; instead
  verify the output file's state and auto-restore from backup if missing/corrupted, matching the correct
  pattern already used in _ai_tool_patch_file.
backlog_items:
- id: BUG-002
  role: primary
root_causes:
- RC-013
depends_on: []
blocks: []
boundary_rationale: >-
  BUG-002 is isolated to two files sharing the identical incorrect backup-then-overwrite-then-delete-backup
  pattern, with a known-correct reference implementation already in the codebase (_ai_tool_patch_file)
  to copy from. One coherent change, one verification pass.
why_not_more:
- No other backlog item shares this exact mechanism; TECH-001's shared confirm helper (Session 15) is
  a related-but-distinct concern (the confirm step, not the backup-restore step) for a different set of
  commands.
why_not_less:
- Both locations (aicode, aipatch) need the identical restore-before-delete fix; fixing only one leaves
  the same failure mode reachable from the other.
scope:
  include:
  - Remove `rm -f $backup` on the mv-failure path in both locations
  - Add `[ -f $output ] || command cp -f $backup $output` before reporting status
  - Verify $output's actual post-failure state before reporting to the user
  exclude:
  - Changes to the pre-failure (happy-path) apply logic
affected_files:
- 30-code/05-code.zsh
- 35-files/10-aipatch.zsh
affected_functions:
- aicode overwrite path
- aipatch overwrite path
subtasks:
- id: '01'
  title: Inspect all affected files/functions for restore backup instead of deleting it on failed mv overwrite
  type: analysis
  required: true
- id: '02'
  title: Implement the recommended fix(es) for this session's backlog items
  type: implementation
  required: true
- id: '03'
  title: Integrate the change with existing callers and verify no other call sites were missed
  type: integration
  required: true
- id: '04'
  title: Verify each acceptance criterion for this session's backlog items
  type: verification
  required: true
- id: '05'
  title: Run regression checks
  type: regression
  required: true
- id: '06'
  title: Update CHANGELOG.md
  type: documentation
  required: true
- id: '07'
  title: Create full repository checkpoint
  type: checkpoint
  required: true
acceptance_criteria:
- id: AC-01
  description: On mv failure, the backup is preserved (not deleted)
  verification: INTEGRATION
- id: AC-02
  description: If $output is found missing/corrupted after mv failure, it is automatically restored from
    backup
  verification: INTEGRATION
tests:
  targeted:
  - Simulate a cross-filesystem/failing mv in both aicode and aipatch overwrite paths
  - Assert $output is restored and $backup is only removed after confirmed successful restore
regression_checks:
- Happy-path apply (no mv failure) shows no behavior change in either command
risk:
  level: low
  blast_radius: low
  rollback: easy
completion_state:
  application_usable: true
  syntax_valid: true
  tests_passed: true
  changelog_updated: true
  checkpoint_created: true
checkpoint:
  required: true
  filename: agent-after-SESSION-06.zip
  contains: entire repository
handoff:
  next_session: SESSION-07
  notes: >-
    This session's changes must leave the application fully usable. No downstream session strictly depends
    on this one; safe to run in any order relative to independent sessions.
