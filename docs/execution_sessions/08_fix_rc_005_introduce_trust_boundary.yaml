session:
  id: SESSION-08
  title: Fix RC-005 — introduce trust-boundary fencing for untrusted README content
  category: security
  priority: P0
  complexity: M
  weight: 4
objective: >-
  Introduce structural fencing/delimiters (or a separate role:user message) around scanned third-party
  project content (especially README) in the assembled system prompt, and remove the 'JANGAN diragukan'
  (don't doubt) framing for content that is not operator-provided, establishing an explicit trust hierarchy.
backlog_items:
- id: SEC-007
  role: primary
root_causes:
- RC-005
depends_on: []
blocks:
- SESSION-37
boundary_rationale: >-
  SEC-007 is a self-contained Critical prompt-injection architectural gap isolated to the prompt-assembly
  chain (aiscan -> _ai_project_context -> _ai_agent_build_sysprompt). No other backlog item shares this
  exact mechanism, though PROMPT-006 touches the same injection point for skill context at materially
  lower risk (first-party/curated) and is tracked separately.
why_not_more:
- PROMPT-006 (skill overlap/capping) is deliberately not merged in — it is a token-efficiency concern
  for first-party curated content, not a trust-boundary concern for third-party-writable content; different
  risk class, different fix.
why_not_less:
- The fencing mechanism and the removal of the 'don't doubt' framing must land together — fencing without
  softening the framing leaves the model instructed to trust fenced-but-still-privileged content.
scope:
  include:
  - Add explicit fencing/delimiters (XML tags or separate role:user message) around aiscan's README excerpt
  - Remove/soften the 'JANGAN diragukan tanpa alasan kuat' framing for project-sourced content
  - 'Establish explicit trust hierarchy: system > agent instruction > task > trusted first-party context
    > untrusted project content'
  exclude:
  - Live/adversarial model-behavior confirmation (tracked separately as VERIFY-011, Session 37)
  - Changes to legitimate non-adversarial project-context behavior beyond the framing/fencing
affected_files:
- .zsh_bagas/30-ai/45-project.zsh
- .zsh_bagas/30-ai/50-agent/40-runtime/00-sysprompt.zsh
affected_functions:
- aiscan
- _ai_project_context
- _ai_agent_build_sysprompt
