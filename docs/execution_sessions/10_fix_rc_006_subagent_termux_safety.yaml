session:
  id: SESSION-10
  title: Fix RC-006 — subagent Termux safety context + explicit coder tool allowlist
  category: security
  priority: P1
  complexity: S
  weight: 3
objective: >-
  Define an explicit, bounded tool allowlist for the 'coder' subagent role (distinct from 'entire registry')
  and inject Termux safety context into the subagent sysprompt builder for any role with write/shell access,
  applied defensively regardless of the ARCH-001 keep/remove outcome.
backlog_items:
- id: SEC-006
  role: primary
root_causes:
- RC-006
depends_on:
- SESSION-09
blocks: []
boundary_rationale: >-
  SEC-006 shares its affected surface (55-subagent/*) with ARCH-001 and must be sequenced after that decision
  per the backlog's own stated dependency, since the correct allowlist shape depends on whether coder
  remains reachable.
why_not_more:
- This session does not re-litigate the ARCH-001 decision; it only hardens the safety surface, applied
  defensively per the backlog's own recommendation even if coder ends up removed as dead code.
why_not_less:
- The tool-allowlist fix and the Termux-context injection must land together — either alone leaves a real
  safety gap if coder is ever reachable.
scope:
  include:
  - Define explicit bounded tool allowlist for coder role (mirroring researcher's 5-tool readonly allowlist)
  - Inject AI_TERMUX_CONTEXT (or condensed version) into subagent sysprompt builder for any non-readonly
    role
  exclude:
  - The keep/remove decision itself (Session 09, already resolved)
affected_files:
- 55-subagent/05-tool_allowlist.zsh
- 55-subagent/10-sysprompt.zsh
affected_functions:
