session:
  id: SESSION-13
  title: Fix RC-011 — merge overlapping skills and cap simultaneous skill loading
  category: token-efficiency
  priority: P2
  complexity: S
  weight: 2
objective: >-
  Merge/cross-reference the near-identical debugging.md/error_recovery.md skill content and add a cap
  on the number of simultaneously-loaded skill files to bound worst-case system-prompt token overhead.
backlog_items:
- id: PROMPT-006
  role: primary
root_causes:
- RC-011
depends_on: []
blocks: []
boundary_rationale: >-
  PROMPT-006 is a standalone token-efficiency concern isolated to the skill-loading subsystem (70-skills.zsh
  + skills/*.md); no other backlog item shares this root cause.
why_not_more:
- SEC-007's trust-boundary fix (Session 8) touches the same prompt-assembly chain but for a different
  risk class (untrusted third-party content vs. first-party curated skill content) and is intentionally
  not merged.
why_not_less:
- Merging skill content without also capping simultaneous loads leaves the worst-case token blowup only
  partially addressed.
scope:
  include:
  - Merge or cross-reference debugging.md/error_recovery.md overlapping content
  - Add a cap on simultaneously-loaded skill files in _ai_load_skills
  exclude:
  - Content changes to any other skill file
affected_files:
- 70-skills.zsh
- skills/debugging.md
- skills/error_recovery.md
affected_functions:
- _ai_load_skills
