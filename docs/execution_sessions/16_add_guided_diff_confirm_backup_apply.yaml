session:
  id: SESSION-16
  title: Add guided diff/confirm/backup/apply workflow to aifix
  category: ux
  priority: P1
  complexity: M
  weight: 3
objective: >-
  Give aifix the same automated diff + confirm + backup + apply sequence that aipatch already provides,
  reusing the shared _ai_confirm helper, so applying an AI-generated fix is as guided/safe as aipatch's
  equivalent operation.
backlog_items:
- id: UX-001
  role: primary
root_causes:
- RC-003
depends_on:
- SESSION-15
blocks:
- SESSION-17
- SESSION-18
boundary_rationale: >-
  UX-001 shares RC-003 (legacy commands outside the modern guided-apply pattern) with CLI-001 and SEC-005,
  but is sequenced as its own session because its acceptance criteria and verification differ (adding
  a whole new apply workflow to aifix vs. adding a single confirm gate to airun). It depends on Session
  15's shared confirm helper to avoid a 6th ad-hoc confirm implementation.
why_not_more:
- CLI-001's confirm-gate-for-airun fix is scheduled next (Session 17) so that airun's internal use of
  aifix can reuse the apply-helper built here, per UX-001's own AC-4.
why_not_less:
- The diff, confirm, backup, and apply steps must land together to match aipatch's contract; a partial
  subset would leave aifix's workflow still inconsistent with its sibling command.
scope:
  include:
  - Add automatic diff between original and .fixed content
  - Require explicit confirmation (via Session 15's _ai_confirm) before apply
  - Take a backup before any apply
  - Preserve inspect-only mode as an option/flag if feasible
  exclude:
  - airun's own confirm gate (Session 17)
affected_files:
- 30-code/45-fix.zsh
affected_functions:
- aifix
subtasks:
- id: '01'
  title: Inspect all affected files/functions for Add guided diff/confirm/backup/apply workflow to aifix
  type: analysis
  required: true
- id: '02'
  title: Implement the recommended fix(es) for this session's backlog items
  type: implementation
  required: true
- id: '03'
  title: Integrate the change with existing callers and verify no other call sites were missed
  type: integration
  required: true
- id: '04'
  title: Verify each acceptance criterion for this session's backlog items
  type: verification
  required: true
- id: '05'
  title: Run regression checks
  type: regression
  required: true
- id: '06'
  title: Update CHANGELOG.md
  type: documentation
  required: true
- id: '07'
  title: Create full repository checkpoint
  type: checkpoint
  required: true
acceptance_criteria:
- id: AC-01
  description: Running aifix presents an automatic diff between original and .fixed content
  verification: INTEGRATION
- id: AC-02
  description: Applying the fix requires explicit confirmation, matching aipatch's pattern
  verification: INTEGRATION
- id: AC-03
  description: A backup is taken before any apply
  verification: INTEGRATION
- id: AC-04
  description: airun's internal use of aifix can reuse the same apply-helper
  verification: STATIC
tests:
  targeted:
  - Run aifix on a failing script, confirm diff+prompt appear, test both confirm and decline paths
regression_checks:
- aifix standalone still produces a .fixed file with no regression to users relying on current inspect-only
  behavior, if that mode is preserved
risk:
  level: medium
  blast_radius: medium
  rollback: easy
completion_state:
  application_usable: true
  syntax_valid: true
  tests_passed: true
  changelog_updated: true
  checkpoint_created: true
checkpoint:
  required: true
  filename: agent-after-SESSION-16.zip
  contains: entire repository
handoff:
  next_session: SESSION-17
  notes: >-
    This session's changes must leave the application fully usable. Sessions SESSION-17, SESSION-18 depend
    on this session's checkpoint as their safe baseline.
