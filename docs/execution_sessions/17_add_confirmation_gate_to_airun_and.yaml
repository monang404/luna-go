session:
  id: SESSION-17
  title: Add confirmation gate to airun and remove its 3rd redundant execution
  category: cli
  priority: P1
  complexity: S
  weight: 3
objective: >-
  Add the same confirm step used by aipatch/aicode -o before airun's `mv -f "${file}.fixed" "$file"`,
  and eliminate the post-loop fallback's redundant third script execution by reusing the last loop iteration's
  already-captured output/exit code.
backlog_items:
- id: CLI-001
  role: primary
- id: CLI-002
  role: related
root_causes:
- RC-003
- RC-014
depends_on:
- SESSION-15
- SESSION-16
blocks:
- SESSION-18
- SESSION-39
boundary_rationale: >-
  CLI-001 and CLI-002 both live entirely inside airun() in 30-code/50-run.zsh — CLI-001 fixes the missing
  confirm before file overwrite, CLI-002 fixes the redundant 3rd execution in the same function's fallback
  path. Same file, same function, same test harness (an instrumented side-effect-logging script), materially
  reducing combined verification cost versus two separate sessions.
why_not_more:
- SEC-005 (the broader architectural question of whether airun/aifix should join the tool-registry framework,
  or be explicitly documented as trusted local commands) is a distinct, lower-urgency Medium item with
  different acceptance criteria and is scheduled next (Session 18).
why_not_less:
- CLI-001's confirm gate depends on Session 16's aifix apply-helper existing first (per UX-001 AC-4),
  so it cannot be pulled earlier; CLI-002 is bundled here rather than split out since it touches the exact
  same function.
scope:
  include:
  - Add confirm step (reusing Session 15/16's helper) before airun's mv -f overwrite
  - Reuse the last loop iteration's $output/$exit_code instead of re-invoking python3 "$file" a 3rd time
  exclude:
  - aifix's own workflow changes (Session 16, already complete)
affected_files:
- 30-code/50-run.zsh
affected_functions:
- airun
