acceptance_criteria:
- id: AC-01
  description: airun prompts for confirmation before overwriting the original file, matching aipatch/aicode
    -o's contract
  verification: INTEGRATION
- id: AC-02
  description: Declining the confirmation leaves the original file unchanged
  verification: INTEGRATION
- id: AC-03
  description: The .bak.$(_ai_ts) backup is still taken (no regression)
  verification: REGRESSION
- id: AC-04
  description: A side-effect-instrumented test script shows exactly 2 executions (not 3) after airun exhausts
    its retry loop
  verification: INTEGRATION
tests:
  targeted:
  - Instrumented side-effect-logging script run through airun's full failing-retry path, assert exactly
    2 executions
  - Confirm-then-decline test asserting original file is byte-for-byte unchanged
regression_checks:
- Existing aifix-only (non-airun) behavior unaffected
