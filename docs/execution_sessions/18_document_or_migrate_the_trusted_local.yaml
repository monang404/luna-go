session:
  id: SESSION-18
  title: Document or migrate the trusted-local-command security model for aifix/airun
  category: security
  priority: P2
  complexity: S
  weight: 2
objective: >-
  Either migrate aifix/airun under the tool-registry/permission umbrella, or explicitly document them
  as 'trusted local commands' with a defined, narrower safety contract, closing the RC-003 architectural
  gap for these two commands.
backlog_items:
- id: SEC-005
  role: primary
root_causes:
- RC-003
depends_on:
- SESSION-16
- SESSION-17
blocks: []
boundary_rationale: >-
  SEC-005 is the architectural/documentation resolution of the same RC-003 gap that CLI-001 and UX-001
  addressed operationally; it is sequenced last within the RC-003 cluster because the decision (migrate
  vs. document) is easier to make correctly once the guided-apply and confirm behavior already exist.
why_not_more:
- This session does not perform a full migration of aifix/airun into the tool-registry/permission framework
  unless that is the explicitly chosen outcome — a full migration would be a materially larger, separate
  effort requiring its own session(s) per the realism test.
why_not_less:
- The decision and its documentation cannot be split smaller without leaving the trust-model question
  unresolved for one of the two commands.
scope:
  include:
  - 'Decide: migrate aifix/airun under tool-registry/permission, OR document as trusted local commands
    with narrower safety contract'
  - Implement the chosen outcome
  exclude:
  - A full architectural migration of the legacy-command family beyond aifix/airun, unless explicitly
    the chosen path and confirmed in-scope for one session
affected_files:
- 30-code/45-fix.zsh
- 30-code/50-run.zsh
affected_functions: []
