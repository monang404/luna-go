boundary_rationale: >-
  Both items are Medium-severity command-discoverability gaps confined to the dispatcher/help surface
  with no functional risk; grouping them avoids two near-identical trivial checkpoints for text-only changes.
why_not_more:
- UX-007's full command-registry consolidation (Session 22) is a larger, separate foundational change;
  this session makes a targeted textual fix now without waiting on that larger migration.
why_not_less:
- Both fixes are single-file, single-purpose textual/naming clarifications; splitting adds checkpoint
  overhead disproportionate to the size of the change.
scope:
