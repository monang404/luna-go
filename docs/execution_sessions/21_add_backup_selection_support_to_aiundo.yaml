session:
  id: SESSION-21
  title: Add backup-selection support to aiundo
  category: cli
  priority: P3
  complexity: S
  weight: 2
objective: >-
  Add an optional backup-selection flag/prompt to aiundo so the user can restore from an older backup,
  not just the most recent .bak.* file by mtime.
backlog_items:
- id: CLI-010
  role: primary
root_causes: []
depends_on: []
blocks: []
boundary_rationale: >-
  CLI-010 is genuine functional enhancement work (not naming/doc) confined to one command; kept as its
  own session since it needs real integration testing distinct from the naming-cleanup batch (Session
  20).
why_not_more:
- No other backlog item touches aiundo's backup-selection logic.
why_not_less:
- The feature (listing + selecting among available backups) cannot usefully be split smaller.
scope:
  include:
  - Add optional backup-selection flag/prompt to aiundo, listing available .bak.* files
  exclude:
  - Changes to how backups are created (out of scope, this is restore-side only)
affected_files:
- 35-files/15-aiundo.zsh
affected_functions:
- aiundo
