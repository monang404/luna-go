session:
  id: SESSION-22
  title: Build unified command registry (single source of truth)
  category: ui
  priority: P1
  complexity: M
  weight: 3
objective: >-
  Build one command registry file (name + description + category per command) consumed by ai h (categorized
  output), tab-completion, and Command Palette, eliminating the three-way drift risk between dispatcher,
  palette, and completion.
backlog_items:
- id: UX-007
  role: primary
root_causes:
- RC-008
depends_on: []
blocks:
- SESSION-23
- SESSION-28
boundary_rationale: >-
  UX-007 is the foundational RC-008 fix explicitly flagged by the source audit as highest-ROI-first-within-phase
  since it resolves three downstream symptoms (help categorization, tab-complete descriptions, and drift
  risk) at once. It is self-contained to the registry file and its three consumers.
why_not_more:
- UX-016 (completion descriptions) is the direct consumer-side benefit of this registry and is scheduled
  as its own dependent session (23) since it requires separately verifying the completion UI behavior.
why_not_less:
- The registry must exist and be the single source for all three consumers (ai h, completion, palette)
  in one change, or the drift risk this fix targets isn't actually eliminated.
scope:
  include:
  - Create 60-ui/00-command_registry.zsh with name+description+category per command
  - Wire ai h to render categorized output (Chat/Code/Files/Workflow/Project/Agent/Utility) from the registry
  - Wire Command Palette to source its list from the registry (resolves UX-002's duplicate-list pattern
    going forward)
  exclude:
  - Populating tab-completion descriptions (Session 23, dependent)
  - UX-002's function-name collision itself (already resolved, Session 04)
affected_files:
- 60-ui/40-dispatcher.zsh
- 60-ui/45-completion.zsh
- 60-ui/screens/palette.zsh
affected_functions:
- _AI_SUBCOMMANDS
- ui_palette
subtasks:
- id: '01'
  title: Inspect all affected files/functions for Build unified command registry (single source of truth)
  type: analysis
  required: true
- id: '02'
  title: Implement the recommended fix(es) for this session's backlog items
  type: implementation
  required: true
- id: '03'
  title: Integrate the change with existing callers and verify no other call sites were missed
  type: integration
  required: true
- id: '04'
  title: Verify each acceptance criterion for this session's backlog items
  type: verification
  required: true
- id: '05'
  title: Run regression checks
  type: regression
  required: true
- id: '06'
  title: Update CHANGELOG.md
  type: documentation
  required: true
- id: '07'
  title: Create full repository checkpoint
  type: checkpoint
  required: true
acceptance_criteria:
- id: AC-01
  description: A single registry file is the source of truth for command name, description, and category
  verification: STATIC
- id: AC-02
  description: ai h output is categorized rather than one flat line
  verification: MANUAL
- id: AC-03
  description: Command Palette sources its list from the same registry (no separate hardcoded list)
  verification: STATIC
- id: AC-04
  description: Registry command count matches _AI_SUBCOMMANDS count
  verification: STATIC
tests:
  targeted:
  - 'Count assertion: registry entries == _AI_SUBCOMMANDS entries'
  - Manual review of ai h categorized output
  - Manual Command Palette render confirms all commands present
regression_checks:
- All 34+ existing commands remain reachable via dispatcher, palette, and completion after migration
risk:
  level: medium
  blast_radius: high
  rollback: moderate
completion_state:
  application_usable: true
  syntax_valid: true
  tests_passed: true
  changelog_updated: true
  checkpoint_created: true
checkpoint:
  required: true
  filename: agent-after-SESSION-22.zip
  contains: entire repository
handoff:
  next_session: SESSION-23
  notes: >-
    This session's changes must leave the application fully usable. Sessions SESSION-23, SESSION-28 depend
    on this session's checkpoint as their safe baseline.
