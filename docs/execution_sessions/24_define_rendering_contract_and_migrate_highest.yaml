session:
  id: SESSION-24
  title: Define rendering contract and migrate highest-ROI commands
  category: ui
  priority: P1
  complexity: L
  weight: 4
objective: >-
  Define one minimal rendering contract (AI_C_* color, unicode+ASCII fallback, NO_COLOR compliance) required
  for any command, document it, and migrate the two highest-priority commands (aiplan, aicode/aifix) to
  the box/state renderer that already satisfies all three properties.
backlog_items:
- id: UX-003
  role: primary
root_causes:
- RC-007
depends_on: []
blocks:
- SESSION-25
- SESSION-26
- SESSION-40
boundary_rationale: >-
  UX-003 is the foundational RC-007 fix; the audit's own consolidation (§13b) explicitly frames the 5-renderer
  fragmentation as one architectural root cause explaining several other findings. This session defines
  the contract and proves it via the two highest-ROI migrations; it is Large but bounded to exactly those
  two commands to keep it realistically completable in one session.
why_not_more:
- UX-004 (diff colorizer) and UX-008 (progress feedback) are downstream consumers of this same root cause
  but touch different commands/files and are scheduled as dependent sessions (25, 26) to keep this session's
  blast radius bounded.
why_not_less:
- A rendering contract with zero migrated commands would be unverifiable; migrating at least the two highest-frequency×coverage-gap
  commands (per the audit's own §18.2 ranking) is the minimum to prove the contract works in practice.
scope:
  include:
  - Document the rendering contract (color via AI_C_*, unicode+ASCII fallback, NO_COLOR/AI_UI_NO_COLOR
    compliance)
  - Migrate aiplan to the box/state renderer pattern
  - Migrate aicode/aifix to the same pattern
  - Add a lint rule flagging hardcoded ANSI escapes outside 60-ui/02-ui_colors.zsh
  exclude:
  - Migrating any command beyond aiplan and aicode/aifix (future work, not required for this session's
    AC)
  - UX-004's diff-colorizer-specific fix and UX-008's progress-feedback fix (dependent sessions)
affected_files:
- 60-ui/*
- 40-workflow/05-aiplan.zsh
- 30-code/05-code.zsh
- 30-code/45-fix.zsh
affected_functions: []
