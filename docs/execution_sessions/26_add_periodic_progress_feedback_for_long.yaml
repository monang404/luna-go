session:
  id: SESSION-26
  title: Add periodic progress feedback for long single-shot commands
  category: ui
  priority: P2
  complexity: S
  weight: 2
objective: >-
  Add a periodic status update (e.g. every 5-10s) visible at default verbosity (AI_VERBOSITY=0) for aiplan/aispec/aiprompt/aicode
  during long API calls, so users can distinguish 'still working' from 'hung'.
backlog_items:
- id: UX-008
  role: primary
root_causes:
- RC-007
depends_on:
- SESSION-24
blocks: []
boundary_rationale: >-
  UX-008 contributes to the RC-007 renderer-coverage pattern but is a distinct concern (progress feedback,
  not styling); scheduled after Session 24 so it can reuse the migrated renderer pattern for aiplan/aicode
  already in place.
why_not_more:
- No other silent-gap command beyond the four named workflow commands is in scope.
why_not_less:
- The feedback must be visible at the *default* verbosity level (0), not just level 1+, per the finding's
  own impact statement — a partial fix at level 1+ only would not resolve the actual reported gap.
scope:
  include:
  - Add periodic status line during _ai_chat_request calls in aiplan/aispec/aiprompt/aicode, visible at
    AI_VERBOSITY=0
  exclude:
  - Changes to the underlying request/timeout logic itself
