session:
  id: SESSION-32
  title: Harden API-key transmission and third-party permissions-override sourcing
  category: security
  priority: P2
  complexity: S
  weight: 2
objective: >-
  Stop passing the API key as a curl command-line argument (switch to stdin-based config or a chmod-600
  temp header file), and print an explicit warning before sourcing a project-local .aiagent/permissions.zsh
  override file.
backlog_items:
- id: SEC-003
  role: primary
- id: SEC-004
  role: primary
root_causes: []
depends_on: []
blocks: []
boundary_rationale: >-
  Both are standalone Medium-severity security hardening items with distinct files but the same category
  (local information-disclosure / supply-chain risk) and the same verification method (SECURITY); grouped
  to keep the security-only session boundary rule (no mixing with UX) while avoiding two near-identical
  small checkpoints.
why_not_more:
- No other backlog item shares either of these specific mechanisms.
why_not_less:
- Both are single-file, well-isolated changes; splitting would not reduce risk, only add checkpoint overhead.
scope:
  include:
  - 'Switch curl -H "Authorization: Bearer $apikey" to -K - (stdin config) or a chmod-600 temp header
    file, deleted immediately after use'
  - Print an explicit warning when .aiagent/permissions.zsh is found before sourcing it
  exclude:
  - Full validation/whitelisting of which variables permissions.zsh may override (documented as a future
    hardening step if not implemented now)
affected_files:
- 10-core/48-http_call_blocking.zsh
- 06-permissions/00-config.zsh
affected_functions: []
