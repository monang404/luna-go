acceptance_criteria:
- id: AC-01
  description: API key never appears in ps/ /proc/<pid>/cmdline output during a request
  verification: SECURITY
- id: AC-02
  description: User receives an explicit warning before .aiagent/permissions.zsh is sourced
  verification: SECURITY
tests:
