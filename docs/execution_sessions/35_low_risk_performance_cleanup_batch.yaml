boundary_rationale: >-
  All three are independent, low-risk, no-shared-root-cause performance micro-optimizations explicitly
  noted by the source audit as non-critical; grouped as a single low-overhead batch per the underloaded-session
  guidance.
why_not_more:
- No other backlog item is a pure performance optimization.
why_not_less:
- Each fix alone is a few lines; splitting into 3 sessions would each be far below the realistic minimum
  session size for the verification/checkpoint overhead involved.
