objective: >-
  Confirm end-to-end, against a live provider, that (a) BUG-005's role-aware trim fix (Session 03) produces
  no degraded/confused model output after 15+ turns, and (b) SEC-007's fencing fix (Session 08) causes
  the model to ignore/deprioritize injected instructions in an adversarial README.
