session:
  id: SESSION-38
  title: Interrupt- and state-safety verification suite
  category: verification
  priority: P1
  complexity: M
  weight: 2
objective: >-
  Verify interrupt safety at confirm prompts, mid-tool-call resume consistency, interrupt safety between
  backup and apply, and absence of git-operation race conditions in aibuild/aireview.
backlog_items:
- id: VERIFY-001
  role: primary
- id: VERIFY-004
  role: primary
- id: VERIFY-019
  role: primary
- id: VERIFY-008
  role: primary
root_causes: []
depends_on: []
blocks: []
boundary_rationale: >-
  All four VERIFY items test 'does an interrupt/concurrent-operation at an inopportune moment leave the
  system in an unsafe state' across different commands; grouped as one interrupt/state-safety theme, testable
  with a similar interrupt-timing harness.
why_not_more:
- VERIFY-007 (session persistence permissions) is a distinct concern (file permission model, not interrupt
  timing) and is scheduled separately (Session 42).
why_not_less:
- Each targets a different command/interrupt-point; all four are needed for full interrupt-safety coverage
  of this plan's fixed commands.
scope:
  include:
  - Trigger Ctrl+C exactly during read -t N confirm prompt in aipatch/aiundo/aibakclean, inspect $TMPDIR
  - Interrupt aiagent mid tool-call, then --resume, inspect checkpoint consistency
  - Interrupt precisely between backup and apply steps in aipatch/aicommit
  - Concurrent-execution test for aibuild/aireview against other git operations
  exclude:
  - Code changes — verification-only
affected_files: []
affected_functions: []
subtasks:
- id: '01'
  title: Set up verification harness / test fixtures for this session's VERIFY items
  type: analysis
  required: true
- id: '02'
  title: Execute each VERIFY scenario's Test Procedure and record PASS/FAIL evidence
  type: verification
  required: true
- id: '03'
  title: For any FAIL result, file a new DISCOVERED_DURING_SESSION follow-up backlog note (do not silently
    alter MASTER_BACKLOG.md)
  type: regression
  required: true
- id: '04'
  title: Update CHANGELOG.md with verification results (PASS/FAIL per item)
  type: documentation
  required: true
- id: '05'
  title: Create full repository checkpoint
  type: checkpoint
  required: true
acceptance_criteria:
- id: AC-VERIFY-001
  description: 'PASS: no leftover tmpnew/temp files, exit code 130. FAIL: stray temp file left on disk
    (Low if failed)'
  verification: MANUAL
- id: AC-VERIFY-004
  description: 'PASS: resumes cleanly from last valid checkpoint. FAIL: corrupted/partial state on resume
    (Medium if failed)'
  verification: INTEGRATION
- id: AC-VERIFY-019
  description: 'PASS: clean rollback or safe partial state. FAIL: file left in inconsistent state (Medium
    if failed)'
  verification: INTEGRATION
- id: AC-VERIFY-008
  description: 'PASS: no corruption/inconsistent commit state. FAIL: corruption observed (Medium if failed)'
  verification: INTEGRATION
tests:
  targeted:
  - Precise-timing interrupt harness for each of the 4 scenarios
regression_checks:
- N/A — verification-only; any FAIL produces a new backlog item
risk:
  level: low
  blast_radius: low
  rollback: n/a
completion_state:
  application_usable: true
  syntax_valid: true
  tests_passed: true
  changelog_updated: true
  checkpoint_created: true
checkpoint:
  required: true
  filename: agent-after-SESSION-38.zip
  contains: entire repository
handoff:
  next_session: SESSION-39
  notes: >-
    This session's changes must leave the application fully usable. No downstream session strictly depends
    on this one; safe to run in any order relative to independent sessions.
