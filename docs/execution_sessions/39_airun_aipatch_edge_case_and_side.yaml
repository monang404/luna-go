- SESSION-17
blocks: []
boundary_rationale: >-
  All three exercise edge cases of the airun/aipatch commands whose core behavior was just fixed in Session
  17; scheduled after that fix so VERIFY-002's 'side-effect count matches expectation given CLI-002 fix
  status' can be meaningfully evaluated.
why_not_more:
- Terminal-rendering and documentation-accuracy VERIFY items are unrelated themes and scheduled separately
  (Sessions 40-41).
why_not_less:
- VERIFY-002 specifically depends on Session 17's fix status to be meaningful; bundling the other two
  small airun/aipatch edge-case checks here avoids a third near-identical small verification session.
scope:
