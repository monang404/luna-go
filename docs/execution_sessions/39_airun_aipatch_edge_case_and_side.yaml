  title: airun/aipatch edge-case and side-effect verification
  category: verification
  priority: P1
  complexity: S
  weight: 2
objective: >-
  Verify airun's real-world side-effect execution count post-fix, aipatch's behavior on a 0-byte file,
  and airun's CLI-level error handling for non-.py files.
backlog_items:
- id: VERIFY-002
  role: primary
- id: VERIFY-017
  role: primary
- id: VERIFY-018
  role: primary
root_causes: []
