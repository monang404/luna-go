session:
  id: SESSION-40
  title: Setup skeleton project Go + cross-compile pipeline untuk Termux
  category: infra
  priority: P0
  complexity: S
  weight: 2
objective: Bikin fondasi project Go baru (go.mod, struktur cmd/+internal/, Makefile, CI build) yang bisa
  di-cross-compile ke linux/arm64 (Termux) tanpa menyentuh atau menjalankan zsh_bagas lama sama sekali.
backlog_items:
- id: MIG-00
  role: primary
root_causes: []
depends_on: []
blocks:
- SESSION-41
boundary_rationale: Ini murni infrastruktur baru, tidak overlap dengan modul zsh manapun — harus jadi
  sesi pertama karena semua sesi migrasi berikutnya butuh skeleton ini sebagai tempat menaruh kode.
why_not_more:
- Belum porting logic apapun di sesi ini — godaan untuk langsung porting config sekalian harus ditahan
  supaya skeleton bisa diverifikasi biner-nya jalan (`go build`, `go run`) sebelum ada logic nyata di
  dalamnya.
why_not_less:
- Skeleton kosong tanpa CI cross-compile tidak cukup — perlu dipastikan dari awal binary benar-benar bisa
  jalan di Termux arm64, bukan cuma di dev machine, supaya masalah platform ketahuan sedini mungkin.
scope:
  include:
  - Inisialisasi go.mod (module path sesuai repo GitHub)
  - Struktur folder cmd/zshbagas + internal/ (package kosong dengan doc.go per package placeholder)
  - 'Makefile: build, build-termux (GOOS=linux GOARCH=arm64), test, lint'
  - 'CI workflow: build multi-arch, jalanin go vet + go test ./... on push'
  - Binary placeholder yang cuma print versi & 'zsh_bagas (go) — under construction'
  exclude:
  - Logic apapun dari modul 30-ai (belum ada yang diporting)
  - Instalasi/distribusi end-user (itu SESSION-56)
source_zsh_files: []
target_go_files:
- go.mod
- Makefile
- cmd/zshbagas/main.go
- internal/README.md
- .github/workflows/build.yml
