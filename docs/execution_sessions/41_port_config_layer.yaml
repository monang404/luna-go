session:
  id: SESSION-41
  title: Port 30-ai/00-config/* ke internal/config
  category: core-logic
  priority: P0
  complexity: M
  weight: 3
objective: Port seluruh config layer (model map, provider order, limits, runtime guards, persona, sysprompt
  spec, providers) dari 9 file zsh menjadi package Go internal/config yang type-safe, tanpa network atau
  UI dependency.
backlog_items:
- id: MIG-01
  role: primary
root_causes: []
depends_on:
- SESSION-40
blocks:
- SESSION-43
- SESSION-44
boundary_rationale: Semua 9 file config ini murni deklarasi data (map provider->endpoint/model/key_var,
  urutan fallback, batas token, dsb) tanpa side effect — bisa diporting dan ditest sebagai satu unit koheren
  tanpa menyentuh HTTP atau tool dispatch.
why_not_more:
- Belum implementasi pembacaan `~/.secrets.zsh` yang penuh (parser env-file) di sesi ini — cukup baca
  dari os.Getenv dulu; parser secrets file custom didorong ke sesi ini juga karena berkaitan erat (AI_PROVIDERS
  bergantung ke env var API key) tapi dibatasi supaya tidak melebar ke logic guard.
why_not_less:
- Tidak bisa dipecah lebih kecil dari ini karena semua 9 file saling referensi (mis. AI_PROVIDER_ORDER
  dan AI_PROVIDERS dipakai bareng oleh provider_candidate nantinya) — memecahnya berisiko struct setengah
  jadi yang tidak bisa langsung ditest end-to-end.
scope:
  include:
  - Struct Provider{Endpoint, Model, KeyVar string}
  - Map providers (groq/gemini/cerebras/deepseek) + auto-skip kalau env var key kosong (parity dengan
    zsh)
  - Struct Limits (token budget, context window, dsb dari 15-limits.zsh)
  - Persona & sysprompt spec sebagai string template Go (text/template atau const)
  - 'Loader `~/.secrets.zsh`-compatible: parser baris `export FOO=bar` sederhana'
  exclude:
  - HTTP call ke provider manapun (itu SESSION-44/45)
  - Runtime guards yang menyentuh proses/OS (didorong ke internal/permission di SESSION-42 kalau overlap)
source_zsh_files:
- 30-ai/00-config/00-models.zsh
- 30-ai/00-config/05-provider_order.zsh
- 30-ai/00-config/10-paths.zsh
- 30-ai/00-config/15-limits.zsh
- 30-ai/00-config/20-runtime_guards.zsh
- 30-ai/00-config/25-persona.zsh
- 30-ai/00-config/30-sysprompt_spec.zsh
- 30-ai/00-config/35-providers.zsh
- 30-ai/00-config/40-context_engine_docs.zsh
target_go_files:
- internal/config/models.go
- internal/config/providers.go
- internal/config/limits.go
- internal/config/persona.go
- internal/config/sysprompt.go
- internal/config/secrets.go
