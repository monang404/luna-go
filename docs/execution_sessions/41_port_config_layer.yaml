  description: Provider tanpa API key di env otomatis ter-skip dari daftar aktif, sama seperti AI_PROVIDER_ORDER
    lama
  verification: UNIT
- id: AC-02
  description: Semua default model (mis. gemini-flash-latest, gpt-oss-120b) match persis dengan nilai
    di 35-providers.zsh
  verification: UNIT
- id: AC-03
  description: Loader `~/.secrets.zsh` sukses parse minimal 1 baris export dan set-kan ke environment
    proses
  verification: UNIT
- id: AC-04
  description: Tidak ada field config yang hardcoded ganda (satu source of truth per provider)
  verification: STATIC
