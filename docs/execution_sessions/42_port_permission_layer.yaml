session:
  id: SESSION-42
  title: Port 30-ai/06-permissions/* ke internal/permission
  category: core-logic
  priority: P0
  complexity: M
  weight: 3
objective: Port path guard, permission check, dan perm ask/write/shell dari 6 file zsh menjadi package
  Go internal/permission dengan fungsi murni yang mudah ditest tanpa I/O nyata.
backlog_items:
- id: MIG-02
  role: primary
root_causes: []
depends_on:
- SESSION-40
blocks:
- SESSION-47
- SESSION-48
boundary_rationale: Semua 7 file permission ini adalah lapisan keamanan sebelum tool apapun (fs write,
  shell exec) boleh jalan — perlu jadi package tersendiri yang selesai & teruji penuh sebelum tool dispatch
  nyata (SESSION-47/48) mulai diporting, supaya tidak ada window di mana tool write/shell jalan tanpa
  guard.
why_not_more:
- Belum diintegrasikan ke tool dispatch nyata di sesi ini (itu SESSION-43/47/48) — sesi ini cuma membangun
  & mengetes fungsi guard-nya sebagai unit terisolasi.
why_not_less:
- Path guard dan permission check tidak bisa dipisah sesi karena permission_check.zsh langsung memanggil
  path_guard sebagai bagian dari keputusan izin — memisahnya bikin salah satu sisi tidak bisa ditest secara
  realistis.
scope:
  include:
  - Fungsi IsPathAllowed(path string) (bool, reason)
  - Fungsi CheckPermission(capability, path string) (Decision, error) — readonly/write/shell.arbitrary
  - Interactive ask-confirmation hook (interface, implementasi nyata di UI layer nanti)
  - 'Agent context struct (role: primary/subagent, dsb) dipakai buat keputusan izin'
  exclude:
  - Implementasi nyata prompt konfirmasi interaktif di terminal (itu bagian UI, SESSION-52/53)
  - Tool dispatch pemanggil (itu SESSION-43/47/48)
source_zsh_files:
- 30-ai/06-permissions/00-config.zsh
- 30-ai/06-permissions/05-agent_context.zsh
- 30-ai/06-permissions/10-path_guard.zsh
- 30-ai/06-permissions/15-permission_check.zsh
- 30-ai/06-permissions/20-perm_ask.zsh
- 30-ai/06-permissions/25-perm_write.zsh
- 30-ai/06-permissions/30-perm_shell.zsh
target_go_files:
- internal/permission/pathguard.go
- internal/permission/check.go
- internal/permission/ask.go
- internal/permission/context.go
