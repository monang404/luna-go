  - Table-driven test path guard dengan >=10 kasus path dari kasus nyata di 10-path_guard.zsh
  - Test capability decision matrix (readonly/write/shell x primary/subagent)
regression_checks:
- Cross-check semua kasus path traversal yang sebelumnya jadi bug fix (RC audit lama) tetap tertolak di
  versi Go
