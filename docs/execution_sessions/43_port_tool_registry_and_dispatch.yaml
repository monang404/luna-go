session:
  id: SESSION-43
  title: Port 30-ai/05-tools registry & dispatch skeleton ke internal/tools
  category: core-logic
  priority: P0
  complexity: M
  weight: 3
objective: Port AI_TOOL_REGISTRY, tool capability map, args extraction, autodep, dan dispatcher generik
  (tanpa implementasi tool individual) menjadi interface Go Tool{} + registry, siap diisi tool nyata di
  sesi 47-48.
backlog_items:
- id: MIG-03
  role: primary
root_causes: []
depends_on:
- SESSION-41
- SESSION-42
blocks:
- SESSION-47
- SESSION-48
boundary_rationale: Registry dan dispatcher generik adalah lapisan yang dipakai bersama oleh SEMUA tool
  individual (fs, git, web_fetch, todo) — harus selesai duluan sebagai interface yang stabil sebelum tool
  nyata diimplementasikan, supaya tool-tool itu tinggal register diri tanpa desain ulang.
why_not_more:
- Belum ada implementasi Execute() nyata untuk tool manapun di sesi ini — hanya interface Tool, registry
  map, dan skeleton dispatcher yang mem-validasi JSON args sebelum manggil Execute.
why_not_less:
- Registry, args-extraction, dan dispatcher tidak bisa dipisah jadi 3 sesi karena args_extract adalah
  bagian integral dari alur dispatch (extract dulu baru validasi baru execute) — memisahnya cuma menambah
  overhead handoff tanpa nilai tambah.
scope:
  include:
  - interface Tool { Name() string; Capability() string; Execute(ctx, args json.RawMessage) (Result, error)
    }
  - Registry map[string]Tool dengan metadata (deskripsi, readonly/write/shell) sama seperti AI_TOOL_REGISTRY
  - 'Dispatcher: parse JSON args -> validasi schema minimal -> panggil permission.CheckPermission -> Execute'
  - Tool dummy 'noop' untuk pastikan alur dispatch penuh bisa ditest end-to-end tanpa tool nyata
  exclude:
  - Implementasi tool fs/git/web_fetch/todo nyata (itu SESSION-47/48)
  - Streaming/model-facing tool schema JSON buat sysprompt (itu bagian llmclient/agent)
source_zsh_files:
- 30-ai/05-tools/00-tool_registry.zsh
- 30-ai/05-tools/02-tool_args_extract.zsh
- 30-ai/05-tools/02-tool_autodep.zsh
- 30-ai/05-tools/05-tool_dispatch.zsh
target_go_files:
- internal/tools/registry.go
- internal/tools/dispatch.go
- internal/tools/tool.go
