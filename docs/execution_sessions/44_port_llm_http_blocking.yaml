acceptance_criteria:
- id: AC-01
  description: Payload JSON yang dihasilkan BuildPayload identik strukturnya dengan output payload_builder.zsh
    untuk input sama
  verification: UNIT
- id: AC-02
  description: CallBlocking sukses round-trip nyata ke minimal 1 provider asli (pakai API key dev) dan
    parse response benar
  verification: MANUAL
- id: AC-03
  description: Provider candidate selection menghormati AI_PROVIDER_ORDER dan skip provider tanpa key,
    sama seperti config layer
  verification: UNIT
- id: AC-04
  description: Timeout HTTP dihormati (request lambat di-cancel sesuai limits.go)
  verification: UNIT
