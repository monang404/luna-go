session:
  id: SESSION-44
  title: Port HTTP blocking call + payload builder ke internal/llmclient
  category: networking
  priority: P1
  complexity: M
  weight: 3
objective: Port 48-http_call_blocking.zsh, 43-payload_builder.zsh, dan 41-provider_candidate.zsh menjadi
  internal/llmclient dengan net/http (bukan lagi shell-out ke curl), untuk jalur request non-streaming.
backlog_items:
- id: MIG-04
  role: primary
root_causes: []
depends_on:
- SESSION-41
blocks:
- SESSION-45
- SESSION-46
boundary_rationale: Jalur blocking (non-streaming) lebih sederhana dari SSE dan jadi fondasi struct request/response
  yang bakal dipakai ulang oleh jalur streaming di SESSION-45 — worth diselesaikan & ditest duluan sebagai
  baseline sebelum kompleksitas SSE ditambahkan.
why_not_more:
- Belum menyentuh SSE stream parsing sama sekali (itu SESSION-45) — sesi ini murni request/response penuh
  (bukan chunked), yang secara natural lebih sedikit permukaan bug.
why_not_less:
- Payload builder dan provider candidate selection tidak bisa dipisah dari blocking call karena ketiganya
  membentuk satu alur (pilih provider -> bangun payload -> kirim call) yang perlu ditest sebagai satu
  round-trip nyata ke provider asli.
scope:
  include:
  - Struct Request/Response OpenAI-compatible (messages, tools, model, dst.)
  - func BuildPayload(cfg, messages, tools) ([]byte, error) — port 1:1 dari payload_builder.zsh
  - func SelectProviderCandidate(cfg, previousFailures) (Provider, error) — port provider_candidate.zsh
  - func CallBlocking(ctx, provider, payload) (Response, error) pakai net/http, timeout dari config.Limits
  exclude:
  - Circuit breaker & retry decision (itu SESSION-46, walau CallBlocking dipanggil olehnya nanti)
  - SSE/streaming path (itu SESSION-45)
source_zsh_files:
- 30-ai/10-core/48-http_call_blocking.zsh
- 30-ai/10-core/43-payload_builder.zsh
- 30-ai/10-core/41-provider_candidate.zsh
target_go_files:
- internal/llmclient/blocking.go
- internal/llmclient/payload.go
- internal/llmclient/candidate.go
