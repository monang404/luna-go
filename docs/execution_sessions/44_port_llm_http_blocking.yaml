  - Manual round-trip test ke 1 provider asli (butuh API key di environment dev) dengan payload minimal
  - Test provider candidate fallback saat provider pertama gagal
regression_checks:
- Pastikan tidak ada shell-out ke curl tersisa di package ini (full net/http)
