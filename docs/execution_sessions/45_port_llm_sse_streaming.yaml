session:
  id: SESSION-45
  title: Port SSE streaming call + line parser ke internal/llmclient
  category: networking
  priority: P1
  complexity: L
  weight: 5
objective: Port 55-request_streaming.zsh dan 56-sse_line_parser.zsh menjadi jalur streaming Go pakai bufio.Scanner
  di atas http.Response.Body, dengan context cancellation saat user interrupt (Ctrl+C).
backlog_items:
- id: MIG-05
  role: primary
root_causes: []
depends_on:
- SESSION-44
blocks:
- SESSION-46
- SESSION-49
boundary_rationale: SSE streaming adalah bagian teknis paling berisiko di seluruh migrasi (disebutkan
  eksplisit di rencana implementasi) — diberi sesi tersendiri dengan complexity L supaya dapat waktu &
  fixture test yang cukup, dipisah dari blocking call yang sudah stabil di SESSION-44.
why_not_more:
- Belum termasuk circuit breaker/retry di jalur streaming (itu SESSION-46) — sesi ini fokus murni ke parsing
  byte stream jadi event yang benar, termasuk kasus chunk terpotong di tengah baris.
why_not_less:
- Streaming call dan SSE line parser tidak bisa dipisah sesi karena satu-satunya cara memverifikasi parser
  benar adalah menjalankannya di atas stream nyata (bukan cuma unit test string statis) — keduanya perlu
  diverifikasi bersamaan lewat fixture recorded response.
scope:
  include:
  - func CallStreaming(ctx, provider, payload) (<-chan Event, error)
  - 'SSE line parser: handle ''data: '' prefix, ''[DONE]'' sentinel, chunk terpotong di batas buffer'
  - context.Context cancellation -> tutup response body & channel dengan bersih saat user interrupt
  - Rekam >=3 fixture response stream asli (Groq/Gemini/Cerebras) buat replay test tanpa network
  exclude:
  - Circuit breaker/retry logic di sekitar streaming (itu SESSION-46)
  - Rendering token yang di-stream ke layar (itu bagian UI/chat, SESSION-52+)
source_zsh_files:
- 30-ai/10-core/55-request_streaming.zsh
- 30-ai/10-core/56-sse_line_parser.zsh
target_go_files:
- internal/llmclient/streaming.go
- internal/llmclient/sse.go
