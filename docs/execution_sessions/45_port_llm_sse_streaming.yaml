acceptance_criteria:
- id: AC-01
  description: Parser menghasilkan event yang identik untuk fixture stream utuh vs stream yang di-chunk
    manual jadi potongan kecil
  verification: UNIT
- id: AC-02
  description: '''[DONE]'' sentinel menghentikan channel dengan bersih tanpa error'
  verification: UNIT
- id: AC-03
  description: Ctrl+C (context cancel) saat streaming aktif menutup koneksi tanpa goroutine leak
  verification: UNIT
- id: AC-04
  description: Replay fixture asli dari 3 provider berbeda menghasilkan text akhir yang sama dengan hasil
    zsh lama untuk prompt sama
  verification: MANUAL
tests:
  targeted:
  - Fixture replay test dengan stream dipotong di berbagai byte boundary (simulasi TCP chunking nyata)
  - Goroutine leak test pakai goleak setelah context cancel
  - Manual streaming call nyata ke provider asli, bandingkan output akhir vs run zsh_bagas lama untuk
    prompt identik
regression_checks:
- 'Load test ringan: streaming response panjang (>5000 token) tidak bikin memory growth tak wajar'
