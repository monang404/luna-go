acceptance_criteria:
- id: AC-01
  description: Circuit breaker membuka (stop calling) setelah N kegagalan beruntun sesuai threshold di
    40-circuit_breaker.zsh
  verification: UNIT
- id: AC-02
  description: Retry decision menghormati max attempts & backoff yang sama dengan retry_decision.zsh
  verification: UNIT
- id: AC-03
  description: TrimToFit memangkas history sampai di bawah token budget tanpa merusak urutan pesan system/terbaru
  verification: UNIT
- id: AC-04
  description: Estimasi token dalam toleransi wajar (misal +/-10%) dibanding penghitungan token_budget.zsh
    lama
  verification: UNIT
tests:
  targeted:
  - Table-driven test circuit breaker state transitions (closed->open->half-open->closed)
  - Test TrimToFit dengan history panjang buatan, pastikan system prompt tidak pernah terpangkas
  - Bandingkan hasil EstimateTokens vs implementasi lama untuk >=10 sample teks
regression_checks:
- Pastikan retry tidak pernah retry error non-transient (mis. 401 auth error) — parity dengan retry_decision.zsh
