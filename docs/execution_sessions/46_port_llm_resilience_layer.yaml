session:
  id: SESSION-46
  title: Port circuit breaker, retry, token budget, session trim ke internal/llmclient
  category: networking
  priority: P1
  complexity: M
  weight: 3
objective: Port 40-circuit_breaker.zsh, 44-retry_decision.zsh, 42-token_budget.zsh, dan 60-session_trim.zsh
  menjadi lapisan resilience yang membungkus CallBlocking/CallStreaming dari SESSION-44/45.
backlog_items:
- id: MIG-06
  role: primary
root_causes: []
depends_on:
- SESSION-44
- SESSION-45
blocks:
- SESSION-49
boundary_rationale: Keempat file ini sama-sama lapisan 'keputusan' di sekitar call HTTP inti (kapan retry,
  kapan buka circuit, kapan trim history) — logicnya mirip (state + threshold + keputusan), koheren dijadikan
  satu sesi setelah jalur HTTP dasarnya (44/45) sudah ada dan stabil.
why_not_more:
- Belum wiring ke agent loop nyata (itu SESSION-49) — sesi ini menyediakan fungsi keputusan yang murni
  & testable, dipanggil sebagai unit terpisah dulu.
why_not_less:
- Circuit breaker dan retry decision saling bergantung erat (retry decision mengecek state circuit breaker
  sebelum retry) sehingga tidak realistis dipisah sesi; token budget & session trim juga satu keluarga
  masalah (menjaga context tetap dalam limit) yang berbagi struct config yang sama.
scope:
  include:
  - Struct CircuitBreaker{state, failureCount, threshold, cooldown} + method Allow()/RecordSuccess()/RecordFailure()
  - func ShouldRetry(err, attempt, maxAttempts) (bool, backoff time.Duration)
  - func EstimateTokens(text) int + func TrimToFit(messages, budget) []Message
  - Wiring opsional (helper) yang membungkus CallBlocking/CallStreaming dengan retry+circuit breaker
  exclude:
  - Perubahan behavior threshold/limit numerik dari nilai default yang sudah ada di zsh (port nilai apa
    adanya)
source_zsh_files:
- 30-ai/10-core/40-circuit_breaker.zsh
- 30-ai/10-core/44-retry_decision.zsh
- 30-ai/10-core/42-token_budget.zsh
- 30-ai/10-core/60-session_trim.zsh
target_go_files:
- internal/llmclient/circuitbreaker.go
- internal/llmclient/retry.go
- internal/llmclient/tokenbudget.go
- internal/llmclient/sessiontrim.go
