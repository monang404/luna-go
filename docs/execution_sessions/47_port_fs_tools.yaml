  - Test tiap tool dengan path valid, path di luar project root (harus ditolak), args malformed
  - Test patch_file dengan unified diff nyata dari fixture, pastikan hasil file akhir sama seperti `patch
    -p0`
  - 'Test khusus: coba panggil write_file tanpa lolos permission check, harus gagal'
regression_checks:
- Rerun seluruh test SESSION-42 (permission) untuk pastikan integrasi tidak melonggarkan guard yang sudah
