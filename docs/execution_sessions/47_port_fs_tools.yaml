session:
  id: SESSION-47
  title: Port tool filesystem (read/write/patch/delete) ke internal/tools
  category: tools
  priority: P1
  complexity: M
  weight: 3
objective: Implementasikan Tool interface (dari SESSION-43) untuk read_file, list_dir, grep_search, glob_search,
  count_lines, write_file, edit_file, patch_file, move_file, delete_file — port dari 10-tool_fs_read.zsh,
  20-tool_fs_write.zsh, 25-tool_fs_patch_delete.zsh.
backlog_items:
- id: MIG-07
  role: primary
root_causes: []
depends_on:
- SESSION-42
- SESSION-43
blocks:
- SESSION-51
boundary_rationale: Sepuluh tool filesystem ini berbagi pola yang sama (extract path dari args -> permission.CheckPermission
  -> operasi os/io -> hasil terstruktur) dan saling terkait riwayat bug (mis. RC-001 local-path collision
  yang pernah menimpa 7 dari tool-tool ini) — koheren diporting sekaligus dengan test yang saling silang-cek.
why_not_more:
- delete_file di sesi ini tetap wajib backup ke .bak sebelum hapus (parity persis dengan zsh) — tidak
  menambah fitur baru seperti trash/undo history yang lebih canggih, itu di luar scope migrasi murni.
why_not_less:
- Read-tools dan write-tools tidak dipisah sesi karena semuanya bergantung ke fungsi extract-path yang
  sama dan perlu diverifikasi bersamaan terhadap permission layer (SESSION-42) supaya tidak ada window
  tool write jalan tanpa guard.
scope:
  include:
  - '10 tool: read_file, list_dir, grep_search (wrapper ripgrep), glob_search (wrapper fd), count_lines,
    write_file (tolak kalau file sudah ada), edit_file (search-replace unik), patch_file (unified diff),
    move_file, delete_file (backup .bak dulu)'
  - Semua write-tool wajib panggil permission.CheckPermission sebelum operasi nyata
  exclude:
  - git_diff/git_status (itu SESSION-48)
  - run_command/exec_process/run_test (itu SESSION-48)
source_zsh_files:
- 30-ai/05-tools/10-tool_fs_read.zsh
- 30-ai/05-tools/20-tool_fs_write.zsh
- 30-ai/05-tools/25-tool_fs_patch_delete.zsh
target_go_files:
- internal/tools/fsread.go
- internal/tools/fswrite.go
- internal/tools/fspatch.go
