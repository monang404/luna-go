acceptance_criteria:
- id: AC-01
  description: git_status/git_diff hasilnya sama persis (format teks) dengan output `git status`/`git
    diff` yang dipanggil versi zsh
  verification: UNIT
- id: AC-02
  description: web_fetch berhasil strip HTML jadi teks bersih untuk minimal 2 halaman fixture nyata
  verification: UNIT
- id: AC-03
  description: 'todo_write/todo_read round-trip: tulis lalu baca kembali menghasilkan checklist identik'
  verification: UNIT
- id: AC-04
  description: run_command tidak muncul di daftar tool default yang di-expose ke model kecuali di-enable
    eksplisit
  verification: STATIC
tests:
