session:
  id: SESSION-48
  title: Port tool git, web_fetch, dan todo ke internal/tools
  category: tools
  priority: P1
  complexity: S
  weight: 2
objective: Implementasikan Tool interface untuk git_status, git_diff, web_fetch, todo_write, todo_read
  — port dari 40-tool_git.zsh, 45-tool_web_fetch.zsh, 50-tool_todo.zsh, plus run_command/exec_process/run_test
  dari 30-tool_process.zsh dan 35-tool_run_test.zsh.
backlog_items:
- id: MIG-08
  role: primary
root_causes: []
depends_on:
- SESSION-42
- SESSION-43
blocks:
- SESSION-51
boundary_rationale: Sisa 7 tool yang belum diporting di SESSION-47 — semuanya lebih kecil & lebih independen
  satu sama lain (git readonly, web_fetch readonly, todo readonly, process/shell capability tersendiri)
  sehingga cukup aman digabung satu sesi berbobot lebih kecil (S) dibanding SESSION-47.
why_not_more:
- run_command tetap ditandai legacy/hidden-from-model-by-default sesuai komentar di tool_registry.zsh
  asli — tidak dihapus supaya backward compatible, tapi tidak dipromosikan jadi default baru.
why_not_less:
- Git/web_fetch/todo/process tidak realistis dipisah lagi jadi 4 sesi terpisah karena masing-masing kecil
  (1 file, <50 baris tiap fungsi) — memecahnya cuma menambah overhead checkpoint tanpa manfaat.
scope:
  include:
  - git_status, git_diff (readonly, wrapper `git status`/`git diff` via os/exec)
  - 'web_fetch: curl ke net/http.Get + strip HTML jadi teks (pakai net/html atau regex sederhana, port
    logic strip yang ada)'
  - 'todo_write/todo_read: simpan checklist sesi ke file lokal (bukan bagian project), format sama seperti
    zsh'
  - exec_process (typed, tanpa shell interpreter) & run_test (typed test runner) & run_command (legacy,
    hidden by default)
  exclude:
  - UI rendering hasil tool (itu bagian screens, SESSION-53)
source_zsh_files:
- 30-ai/05-tools/30-tool_process.zsh
- 30-ai/05-tools/35-tool_run_test.zsh
- 30-ai/05-tools/40-tool_git.zsh
- 30-ai/05-tools/45-tool_web_fetch.zsh
- 30-ai/05-tools/50-tool_todo.zsh
target_go_files:
- internal/tools/git.go
- internal/tools/process.go
- internal/tools/webfetch.go
- internal/tools/todo.go
