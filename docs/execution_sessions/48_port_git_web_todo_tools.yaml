  - Test git tool di repo fixture dengan beberapa file berubah
  - Test web_fetch dengan 2 fixture HTML (halaman sederhana + halaman dengan script/style yang harus di-strip)
  - Test todo round-trip write->read
regression_checks:
- Pastikan exec_process benar-benar tidak lewat shell interpreter (no `/bin/sh -c` di implementasi Go)
