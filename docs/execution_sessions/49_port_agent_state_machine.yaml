session:
  id: SESSION-49
  title: Port agent state machine & policy ke internal/agent
  category: agent-core
  priority: P0
  complexity: L
  weight: 5
objective: Port 39-agent-state-machine.zsh, 00-policy.zsh, 10-state.zsh, dan checkpoint load/save (40-runtime/10-load_checkpoint.zsh)
  menjadi struct state machine Go dengan checkpoint format JSON.
backlog_items:
- id: MIG-09
  role: primary
root_causes: []
depends_on:
- SESSION-41
- SESSION-46
blocks:
- SESSION-50
boundary_rationale: State machine adalah jantung agent — perlu diselesaikan sebagai unit tersendiri sebelum
  loop eksekusi (SESSION-50) ditulis, karena loop hanyalah driver yang memanggil transisi state ini berulang;
  format checkpoint baru (JSON) juga perlu diputuskan & distabilkan di sini duluan.
why_not_more:
- Belum termasuk logic eksekusi tool per iterasi (itu SESSION-50) — sesi ini fokus ke definisi state,
  transisi valid, dan policy yang menentukan transisi mana yang diizinkan.
why_not_less:
- State machine dan checkpoint tidak bisa dipisah sesi karena keduanya adalah representasi yang sama (state
  in-memory vs state ter-serialize) — desain struct state yang tidak dipikirkan bareng kemungkinan besar
  butuh refactor ulang saat checkpoint ditambahkan belakangan.
scope:
  include:
  - Struct AgentState{Phase, Goal, History, PendingTool, Iteration, ...} sesuai state di 10-state.zsh
  - Transisi state sesuai policy di 00-policy.zsh (state apa boleh -> state apa)
  - Format checkpoint JSON baru (BUKAN kompatibel dengan format zsh-var lama)
  - 'Script migrasi satu-kali: baca checkpoint format zsh lama -> tulis ulang sebagai JSON baru (best-effort)'
  exclude:
  - ReAct execution loop nyata yang memanggil provider & tool (itu SESSION-50)
  - Rendering progress/step ke layar (itu UI, SESSION-53)
source_zsh_files:
- 30-ai/50-agent/00-policy.zsh
- 30-ai/50-agent/10-state.zsh
- 30-ai/50-agent/39-agent-state-machine.zsh
- 30-ai/50-agent/40-runtime/10-load_checkpoint.zsh
target_go_files:
- internal/agent/state.go
- internal/agent/policy.go
- internal/agent/checkpoint.go
subtasks:
- id: '01'
