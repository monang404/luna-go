  type: analysis
  required: true
- id: '02'
  title: Implementasi package Go sesuai scope sesi ini
  type: implementation
  required: true
- id: '03'
  title: Integrasikan dengan package lain yang sudah ada & pastikan tidak ada caller yang terlewat
  type: integration
  required: true
- id: '04'
  title: Tulis & jalankan unit test untuk tiap acceptance criterion
  type: verification
  required: true
- id: '05'
  title: Jalankan regression check (go vet, go build, existing test suite)
  type: regression
  required: true
- id: '06'
  title: Update CHANGELOG.md dan MIGRATION_TRACEABILITY.md
  type: documentation
  required: true
- id: '07'
  title: Buat checkpoint penuh repo (source zsh + module Go baru)
  type: checkpoint
  required: true
acceptance_criteria:
- id: AC-01
  description: Semua transisi state yang valid di policy.zsh punya padanan & test di Go
  verification: UNIT
- id: AC-02
  description: Transisi state yang TIDAK valid (mis. dari phase 'done' balik ke 'running') ditolak dengan
    error jelas
  verification: UNIT
- id: AC-03
  description: Checkpoint JSON hasil Save() bisa di-Load() kembali dan menghasilkan state identik (round-trip)
  verification: UNIT
- id: AC-04
  description: Script migrasi checkpoint lama berhasil dijalankan pada minimal 1 checkpoint zsh asli tanpa
    crash
  verification: MANUAL
tests:
  targeted:
  - Table-driven test seluruh matrix transisi state valid/invalid
  - Round-trip test Save->Load checkpoint
  - 'Manual test: jalankan script migrasi pada checkpoint zsh nyata dari repo (kalau ada contohnya)'
regression_checks:
- Pastikan tidak ada state yang unreachable atau dead-end yang tidak sengaja (static analysis manual atas
  graph transisi)
risk:
  level: high
  blast_radius: high
  rollback: moderate
completion_state:
  application_usable: true
  syntax_valid: true
  tests_passed: true
  changelog_updated: true
  checkpoint_created: true
checkpoint:
  required: true
  filename: agent-after-SESSION-49.zip
  contains: entire repository (source zsh_bagas + go/ tree in progress)
notes: Format checkpoint sengaja TIDAK backward compatible (var-dump zsh vs JSON) — ini trade-off sadar
  demi kejelasan long-term, dikompensasi dengan script migrasi satu-kali untuk checkpoint existing.
handoff:
