session:
  id: SESSION-50
  title: Port ReAct execution loop ke internal/agent
  category: agent-core
  priority: P0
  complexity: L
  weight: 5
objective: Port 42-execution/* (loop_main, get_plan, reject_checks, run_tool, log_and_notify, track_and_continue)
  dan 44-finalize.zsh menjadi loop Go yang men-drive state machine dari SESSION-49, memanggil internal/llmclient
  dan internal/tools per iterasi.
backlog_items:
- id: MIG-10
  role: primary
root_causes: []
depends_on:
- SESSION-46
- SESSION-48
- SESSION-49
blocks:
- SESSION-51
- SESSION-55
boundary_rationale: Ini titik integrasi terbesar di seluruh migrasi — menyatukan config, permission, tools,
  llmclient, dan state machine yang sudah diporting di sesi-sesi sebelumnya jadi satu alur ReAct yang
  benar-benar jalan end-to-end untuk pertama kalinya.
why_not_more:
- Belum ada UI/rendering visual di sesi ini (itu SESSION-52/53) — loop ini dites lewat log/print sederhana
  dulu (bukan lewat rendering final), supaya integrasi logic bisa diverifikasi terpisah dari kompleksitas
  visual.
why_not_less:
- Ketujuh file execution ini membentuk satu siklus tak terpisahkan (get plan -> reject-check -> run tool
  -> log -> track&continue -> ulang / finalize) — memecah jadi beberapa sesi akan menyisakan loop yang
  tidak bisa dijalankan end-to-end sampai semua bagian selesai, sehingga tidak ada nilai verifikasi incremental
  yang nyata.
scope:
  include:
  - func RunLoop(ctx, goal string) (FinalResult, error) — loop utama sampai selesai/gagal/interrupt
  - 'GetPlan: panggil llmclient dengan sysprompt+history, parse response jadi rencana/tool-call'
  - 'RejectChecks: validasi rencana model sebelum dieksekusi (guard tambahan di luar permission layer)'
  - 'RunTool: dispatch ke internal/tools lewat registry, catat hasil ke state'
  - 'Finalize: tutup sesi, simpan checkpoint akhir, format hasil ringkas'
  exclude:
  - Subagent spawning (itu SESSION-51, walau loop ini nanti punya hook buat itu)
  - Rendering visual tiap step ke terminal (itu SESSION-53)
source_zsh_files:
- 30-ai/50-agent/42-execution/00-loop_main.zsh
- 30-ai/50-agent/42-execution/05-get_plan.zsh
- 30-ai/50-agent/42-execution/10-reject_checks.zsh
- 30-ai/50-agent/42-execution/15-run_tool.zsh
- 30-ai/50-agent/42-execution/20-log_and_notify.zsh
- 30-ai/50-agent/42-execution/25-track_and_continue.zsh
- 30-ai/50-agent/44-finalize.zsh
target_go_files:
- internal/agent/loop.go
- internal/agent/plan.go
- internal/agent/finalize.go
subtasks:
- id: '01'
  title: Analisis file zsh sumber & rancang struct/interface Go padanannya
  type: analysis
  required: true
- id: '02'
  title: Implementasi package Go sesuai scope sesi ini
  type: implementation
  required: true
- id: '03'
  title: Integrasikan dengan package lain yang sudah ada & pastikan tidak ada caller yang terlewat
  type: integration
  required: true
- id: '04'
  title: Tulis & jalankan unit test untuk tiap acceptance criterion
  type: verification
  required: true
- id: '05'
  title: Jalankan regression check (go vet, go build, existing test suite)
  type: regression
  required: true
- id: '06'
  title: Update CHANGELOG.md dan MIGRATION_TRACEABILITY.md
  type: documentation
  required: true
- id: '07'
  title: Buat checkpoint penuh repo (source zsh + module Go baru)
  type: checkpoint
  required: true
acceptance_criteria:
- id: AC-01
  description: RunLoop berhasil menyelesaikan goal sederhana end-to-end (mis. 'baca file X, laporkan jumlah
    baris') memakai tool nyata & provider nyata
  verification: MANUAL
- id: AC-02
  description: RejectChecks menolak rencana model yang melanggar guard (mis. write ke path terlarang)
    sebelum RunTool dipanggil
  verification: UNIT
- id: AC-03
  description: Checkpoint tersimpan otomatis pada interval yang sama seperti track_and_continue.zsh
  verification: UNIT
- id: AC-04
  description: Interrupt (Ctrl+C) di tengah loop menghasilkan checkpoint valid yang bisa di-resume
  verification: MANUAL
tests:
  targeted:
  - 'End-to-end manual test: goal nyata sederhana dari awal sampai selesai, bandingkan hasil akhir file/perubahan
    vs run zsh_bagas untuk goal identik'
  - Unit test RejectChecks dengan rencana yang seharusnya ditolak (path terlarang, capability tidak di-allowlist)
  - 'Interrupt-and-resume test: Ctrl+C di tengah, load checkpoint, lanjutkan, pastikan tidak ada double-execution
    tool'
regression_checks:
- Rerun seluruh test SESSION-44/45/46/47/48/49 pastikan integrasi tidak meregresi salah satu
risk:
  level: high
  blast_radius: high
  rollback: difficult
completion_state:
  application_usable: true
  syntax_valid: true
  tests_passed: true
  changelog_updated: true
  checkpoint_created: true
checkpoint:
  required: true
  filename: agent-after-SESSION-50.zip
  contains: entire repository (source zsh_bagas + go/ tree in progress)
notes: Sesi paling besar & paling berisiko dari sisi integrasi. Kalau perlu, pecah jadi sesi 50a/50b manual
  (di luar rencana ini) sesuai kondisi nyata pas dikerjakan — tapi secara desain, loop ini memang satu
  unit koheren.
handoff:
  next_session: SESSION-51
  notes: Setelah sesi ini, agent sudah bisa jalan end-to-end lewat CLI minimal (print-based). SESSION-51
    menambah subagent, SESSION-52+ menambah UI penuh.
