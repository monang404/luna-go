session:
  id: SESSION-51
  title: Port subagent orchestration ke internal/subagent
  category: agent-core
  priority: P1
  complexity: M
  weight: 3
objective: Port 55-subagent/* (design_contract, tool_allowlist, sysprompt, run_step, run, debug_allowlist/step/report/debug)
  menjadi package yang men-spawn subagent lewat os/exec + goroutine, reuse loop dari SESSION-50 dengan
  allowlist tool terbatas.
backlog_items:
- id: MIG-11
  role: primary
root_causes: []
depends_on:
- SESSION-47
- SESSION-48
- SESSION-50
blocks:
- SESSION-55
boundary_rationale: Subagent adalah konsumen dari agent loop utama (SESSION-50) plus tool layer (47/48)
  — baru bisa diporting realistis setelah keduanya stabil, karena subagent pada dasarnya menjalankan ulang
  loop yang sama dengan konteks & allowlist yang dipersempit.
why_not_more:
- Belum ada UI progress khusus untuk subagent di sesi ini (itu bagian screens/report, SESSION-53) — fokus
  ke orchestration logic & isolasi allowlist saja.
why_not_less:
- Mode normal subagent dan mode debug subagent (debug_allowlist/step/report) berbagi mekanisme spawn+allowlist
  yang sama persis, cuma beda tujuan — tidak ada manfaat memisahnya jadi 2 sesi.
scope:
  include:
  - func SpawnSubagent(ctx, task, allowlist []string) (Result, error) — reuse internal/agent.RunLoop dengan
    tool set terbatas
  - Tool allowlist per role (primary vs subagent vs debug-subagent), port 1:1 dari tool_allowlist.zsh
    & debug_allowlist.zsh
  - Sysprompt khusus subagent (template terpisah dari sysprompt utama)
  - Debug report generator (ringkasan hasil debug subagent)
  exclude:
  - UI rendering progress subagent secara live (itu SESSION-53)
source_zsh_files:
- 30-ai/55-subagent/00-design_contract.zsh
- 30-ai/55-subagent/05-tool_allowlist.zsh
- 30-ai/55-subagent/10-sysprompt.zsh
- 30-ai/55-subagent/15-run_step.zsh
- 30-ai/55-subagent/20-run.zsh
- 30-ai/55-subagent/25-debug_allowlist.zsh
- 30-ai/55-subagent/30-debug_step.zsh
- 30-ai/55-subagent/35-debug_report.zsh
- 30-ai/55-subagent/40-debug.zsh
target_go_files:
- internal/subagent/run.go
- internal/subagent/allowlist.go
- internal/subagent/sysprompt.go
- internal/subagent/debug.go
