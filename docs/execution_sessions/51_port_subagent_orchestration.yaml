acceptance_criteria:
- id: AC-01
  description: Subagent hanya bisa memanggil tool yang ada di allowlist-nya, tool di luar itu ditolak
    permission layer
  verification: UNIT
- id: AC-02
  description: Subagent tidak bisa membuka circuit breaker/provider config milik parent agent (isolasi
    context)
  verification: UNIT
- id: AC-03
  description: SpawnSubagent berhasil menyelesaikan task sederhana end-to-end dan mengembalikan Result
    terstruktur
  verification: MANUAL
- id: AC-04
  description: Debug report yang dihasilkan memuat field yang sama dengan debug_report.zsh (ringkasan
    langkah, hasil, error)
  verification: UNIT
tests:
  targeted:
  - 'Test allowlist enforcement: subagent coba panggil tool di luar allowlist, harus ditolak'
  - Manual end-to-end test SpawnSubagent dengan task nyata sederhana
  - 'Test isolasi context: subagent gagal tidak mempengaruhi state parent agent'
regression_checks:
- Rerun test SESSION-42 (permission) & SESSION-50 (loop) pastikan reuse loop tidak melonggarkan guard
