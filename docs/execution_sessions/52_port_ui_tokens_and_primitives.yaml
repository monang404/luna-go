session:
  id: SESSION-52
  title: Port design tokens, colors, box, diff colorizer ke internal/ui
  category: ui
  priority: P1
  complexity: M
  weight: 3
objective: Port 02-ui_colors.zsh, 05-ui_box.zsh, 06-ui_diff.zsh, dan 00-ui_text.zsh menjadi package Go
  internal/ui dengan design token (AI_C_*) sebagai const/struct, plus NO_COLOR compliance & unicode/ASCII
  fallback sesuai RENDERING_CONTRACT.md.
backlog_items:
- id: MIG-12
  role: primary
root_causes: []
depends_on:
- SESSION-40
blocks:
- SESSION-53
boundary_rationale: Design token & primitives (warna, box drawing, diff colorizer) adalah fondasi yang
  dipakai oleh SEMUA screen & component di SESSION-53 — perlu selesai & byte-parity dulu dengan RENDERING_CONTRACT.md
  sebelum screen nyata dibangun di atasnya, supaya tidak ada rework visual besar belakangan.
why_not_more:
- Belum ada screen/component composite di sesi ini (itu SESSION-53) — sesi ini murni primitives tingkat
  rendah (cetak warna, gambar box, warnai diff).
why_not_less:
- Colors, box, diff colorizer, dan text tidak bisa dipisah sesi karena diff colorizer secara langsung
  memakai token warna & fungsi text wrapping yang sama — memisahnya bikin diff colorizer tidak bisa diverifikasi
  visual secara realistis.
scope:
  include:
  - Const/struct token AI_C_* (semua nama & escape code sama persis dengan 02-ui_colors.zsh)
  - 'NO_COLOR compliance: deteksi env var NO_COLOR, semua fungsi warna jadi no-op kalau di-set'
  - Box drawing dengan fallback unicode -> ASCII sesuai RENDERING_CONTRACT.md
  - 'Diff colorizer: pewarnaan +/- line, konteks, header, identik dengan 06-ui_diff.zsh untuk fixture
    diff yang sama'
  exclude:
  - Screen composite & layout (home/agent/palette/report) — itu SESSION-53
  - Command registry & routing — itu SESSION-53
source_zsh_files:
- 30-ai/60-ui/00-ui_text.zsh
- 30-ai/60-ui/02-ui_colors.zsh
- 30-ai/60-ui/05-ui_box.zsh
- 30-ai/60-ui/06-ui_diff.zsh
target_go_files:
- internal/ui/tokens.go
- internal/ui/box.go
- internal/ui/diff.go
- internal/ui/text.go
