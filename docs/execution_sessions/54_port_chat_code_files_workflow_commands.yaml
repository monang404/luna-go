session:
  id: SESSION-54
  title: Port command chat, code-project, file-patch, workflow ke internal/ (fitur level tinggi)
  category: features
  priority: P2
  complexity: L
  weight: 5
objective: 'Port fitur level-command yang dipakai langsung user: 20-chat/* (quick chat, aiask, session
  repl/mgmt, aiclip), 30-code/* (project generate/split/salvage/report/autotest/completeness/fix/run),
  35-files/* (aicat, aipatch, aiundo, aibakclean, aishare), 40-workflow/* (aicommit, aiplan, aiprompt,
  aispec, aibuild, aireview, aisummarize).'
backlog_items:
- id: MIG-14
  role: primary
root_causes: []
depends_on:
- SESSION-50
- SESSION-51
- SESSION-53
blocks:
- SESSION-55
boundary_rationale: Keempat modul ini adalah 'fitur' yang dibangun di atas fondasi yang sudah selesai
  (config, permission, tools, llmclient, agent, subagent, UI) — semuanya pada dasarnya orkestrasi command
  spesifik yang memanggil fondasi tersebut, jadi wajar diporting sebagai satu gelombang besar setelah
  fondasi stabil, bukan tersebar di sesi-sesi awal.
why_not_more:
- Belum wiring ke CLI subcommand nyata (itu SESSION-55) — tiap fungsi command diporting & ditest sebagai
  unit yang bisa dipanggil langsung dari test, sebelum di-expose lewat `cobra`.
why_not_less:
- 23+ file di 4 modul ini secara individual kecil dan sangat bergantung ke fondasi yang sama — memecahnya
  jadi 4 sesi terpisah kemungkinan besar cuma menambah overhead checkpoint tanpa nilai verifikasi tambahan,
  karena tidak ada satu pun yang punya risiko teknis setara SSE/state-machine/UI.
scope:
  include:
  - 'Chat: quick chat, aiask (single-shot), session ask/repl/mgmt, aiclip (copy ke clipboard Termux)'
  - 'Code project: generate, split (150-baris rule), salvage, report, autotest, completeness check, fix,
    run'
  - 'File patch: aicat (tampilkan file berwarna), aipatch (apply+confirm+backup), aiundo, aibakclean,
    aishare'
  - 'Workflow: aicommit, aiplan, aiprompt, aispec, aibuild, aireview, aisummarize'
  exclude:
  - CLI subcommand wiring nyata & alias mapping (itu SESSION-55)
source_zsh_files:
- 30-ai/20-chat/00-quick_chat.zsh
- 30-ai/20-chat/05-aiask.zsh
- 30-ai/20-chat/10-session_ask.zsh
- 30-ai/20-chat/15-session_repl.zsh
- 30-ai/20-chat/20-session_mgmt.zsh
- 30-ai/20-chat/25-aiclip.zsh
- 30-ai/30-code/*.zsh
- 30-ai/35-files/*.zsh
- 30-ai/40-workflow/*.zsh
target_go_files:
- internal/chat/*.go
- internal/codeproject/*.go
- internal/filepatch/*.go
- internal/workflow/*.go
subtasks:
- id: '01'
  title: Analisis file zsh sumber & rancang struct/interface Go padanannya
  type: analysis
  required: true
- id: '02'
  title: Implementasi package Go sesuai scope sesi ini
  type: implementation
  required: true
- id: '03'
  title: Integrasikan dengan package lain yang sudah ada & pastikan tidak ada caller yang terlewat
  type: integration
  required: true
- id: '04'
  title: Tulis & jalankan unit test untuk tiap acceptance criterion
  type: verification
  required: true
- id: '05'
  title: Jalankan regression check (go vet, go build, existing test suite)
  type: regression
  required: true
- id: '06'
  title: Update CHANGELOG.md dan MIGRATION_TRACEABILITY.md
  type: documentation
  required: true
- id: '07'
  title: Buat checkpoint penuh repo (source zsh + module Go baru)
  type: checkpoint
  required: true
acceptance_criteria:
- id: AC-01
  description: Tiap command menghasilkan hasil fungsional yang setara dengan versi zsh untuk skenario
    fixture yang sama (bukan byte-identik, tapi behaviorally correct)
  verification: MANUAL
- id: AC-02
  description: aipatch tetap melalui alur guided diff+confirm+backup sebelum apply, sama seperti versi
    zsh
  verification: UNIT
- id: AC-03
  description: project_split tetap menghormati aturan 150-baris per file
  verification: UNIT
- id: AC-04
  description: aicommit menghasilkan pesan commit dengan format yang sama seperti aicommit.zsh untuk diff
    fixture yang sama
  verification: UNIT
tests:
  targeted:
  - Test fungsional per command dengan fixture project kecil (reuse verify37/fixture_project kalau relevan)
  - Manual run tiap command level-tinggi, bandingkan hasil akhir (file yang berubah, commit message, dst.)
    vs versi zsh
  - Test project_split dengan file >150 baris, pastikan split rule dihormati
regression_checks:
- Rerun seluruh test SESSION-47/48 (tools) & SESSION-50 (loop) karena command ini banyak reuse keduanya
risk:
  level: medium
  blast_radius: medium
  rollback: moderate
completion_state:
  application_usable: true
  syntax_valid: true
  tests_passed: true
  changelog_updated: true
  checkpoint_created: true
checkpoint:
  required: true
  filename: agent-after-SESSION-54.zip
  contains: entire repository (source zsh_bagas + go/ tree in progress)
notes: Sesi ini paling besar dari sisi jumlah file tapi risiko teknis paling rendah dibanding SESSION-45/49/50/53
  — kalau waktu terbatas, ini kandidat pertama untuk dipecah jadi beberapa sesi lebih kecil per submodul
  (chat / code / files / workflow) tanpa mengubah urutan dependency.
handoff:
  next_session: SESSION-55
  notes: SESSION-55 menyambungkan seluruh command di sini ke CLI subcommand nyata.
