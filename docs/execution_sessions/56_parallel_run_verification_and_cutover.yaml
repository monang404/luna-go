session:
  id: SESSION-56
  title: Verifikasi paralel (adaptasi verify37/38/39) & cutover instalasi
  category: verification
  priority: P0
  complexity: L
  weight: 5
objective: Adaptasi harness verify37/verify38/verify39 (run_all.zsh) supaya membandingkan output binary
  Go vs zsh_bagas lama pada skenario yang sama, jalankan sebagai alias terpisah (`zshbagas` vs `ai*` lama)
  untuk periode paralel, lalu ganti install.sh ke distribusi binary release dan deprecate jalur zsh.
backlog_items:
- id: MIG-16
  role: primary
root_causes: []
depends_on:
- SESSION-55
blocks: []
boundary_rationale: Ini sesi penutup migrasi — perlu jadi satu unit koheren karena verifikasi paralel
  dan cutover instalasi adalah dua sisi dari keputusan yang sama (baru boleh cutover kalau verifikasi
  paralel sudah lolos), tidak masuk akal dipisah jadi 2 sesi dengan dependency searah yang jelas.
why_not_more:
- Belum menghapus source zsh_bagas lama dari repo di sesi ini — hanya deprecate (tandai non-default, install.sh
  baru default ke binary) supaya rollback tetap mudah kalau ada masalah pasca-cutover ditemukan belakangan.
why_not_less:
- Verifikasi paralel tanpa cutover tidak menyelesaikan migrasi (produk akhir belum bisa dipakai user sebagai
  default); cutover tanpa verifikasi paralel yang memadai terlalu berisiko — keduanya perlu ada dalam
  satu sesi yang sama supaya kriteria 'boleh cutover' eksplisit & terverifikasi.
scope:
  include:
  - Harness baru yang menjalankan skenario yang sama (dari verify37/38/39) lewat kedua binary (zsh_bagas
    lama & zshbagas Go), diff outputnya
  - 'Jalankan periode paralel manual: pakai `zshbagas` sebagai command utama, `ai*` lama tetap ada sebagai
    fallback'
  - 'install.sh baru: download binary release dari GitHub Releases (bukan lagi git clone+source), simpan
    symlink `.zshrc` minimal (PATH + alias saja)'
  - 'Finalisasi MIGRATION_TRACEABILITY.md: tiap fungsi zsh lama -> status DONE dengan link ke sesi & test'
  exclude:
  - Penghapusan source .zsh_bagas/ dari repo (didorong ke sesi terpisah di luar rencana ini, setelah user
    yakin binary Go stabil di pemakaian harian nyata, bukan cuma di test)
source_zsh_files:
- verify37/*.zsh
- verify38/*.zsh
- verify39/*.zsh
- source/install.sh
target_go_files:
- migration_verify/harness_go.go
- install.sh (versi baru, ganti isi)
- docs/MIGRATION_TRACEABILITY.md (final)
subtasks:
- id: '01'
  title: Analisis file zsh sumber & rancang struct/interface Go padanannya
  type: analysis
  required: true
- id: '02'
  title: Implementasi package Go sesuai scope sesi ini
  type: implementation
  required: true
- id: '03'
  title: Integrasikan dengan package lain yang sudah ada & pastikan tidak ada caller yang terlewat
  type: integration
  required: true
- id: '04'
  title: Tulis & jalankan unit test untuk tiap acceptance criterion
  type: verification
  required: true
- id: '05'
  title: Jalankan regression check (go vet, go build, existing test suite)
  type: regression
  required: true
- id: '06'
  title: Update CHANGELOG.md dan MIGRATION_TRACEABILITY.md
  type: documentation
  required: true
- id: '07'
  title: Buat checkpoint penuh repo (source zsh + module Go baru)
  type: checkpoint
  required: true
acceptance_criteria:
- id: AC-01
  description: Harness paralel jalan untuk seluruh skenario verify37/38/39 tanpa diff yang tidak dijelaskan
    (semua diff diverifikasi sengaja atau dianggap bug & diperbaiki)
  verification: UNIT
- id: AC-02
  description: Binary Go dipakai sebagai command utama harian minimal 1 minggu tanpa masalah blocking
    ditemukan
  verification: MANUAL
- id: AC-03
  description: install.sh baru berhasil instalasi bersih di device Termux baru (fresh install) dan menghasilkan
    binary yang jalan
  verification: MANUAL
- id: AC-04
  description: MIGRATION_TRACEABILITY.md menunjukkan 100% fungsi inti (bukan cuma command-level) berstatus
    DONE
  verification: STATIC
tests:
  targeted:
  - Jalankan harness diff untuk seluruh skenario existing di verify37/38/39
  - Pemakaian harian nyata binary Go sebagai driver utama selama periode paralel, catat setiap masalah
    yang muncul
  - Fresh install test di device Termux bersih (bukan device dev yang sudah ada environment lama)
regression_checks:
- Pastikan tidak ada API key/secret yang ter-expose berbeda antara instalasi lama vs baru (audit keamanan
  ringan)
risk:
