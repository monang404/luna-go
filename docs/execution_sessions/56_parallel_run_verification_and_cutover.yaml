notes: Ini gerbang akhir migrasi — jangan cutover default sebelum periode paralel memberi keyakinan nyata
  dari pemakaian harian, bukan cuma dari test otomatis. Setelah sesi ini, migrasi Go dianggap selesai
  untuk fondasi + fitur inti; polish/fitur baru lanjut sebagai sesi normal di backlog Go.
